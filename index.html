<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Asfour Games | لوحة الإدارة</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #3b82f6; --bg-dark: #111827; --card-bg: #1f2937; --text-main: #f9fafb; --text-muted: #9ca3af; --danger: #ef4444; --success: #10b981; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-main); display: flex; flex-direction: column; min-height: 100vh; }
        
        #login-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg-dark); display: flex; justify-content: center; align-items: center; z-index: 9999; flex-direction: column; }
        .login-box { background: var(--card-bg); padding: 30px; border-radius: 15px; text-align: center; border: 1px solid #374151; width: 90%; max-width: 400px; }
        .btn-google { background: white; color: black; border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; font-size: 16px; margin-top: 20px; }
        
        .sidebar { width: 100%; background: var(--card-bg); padding: 15px; display: flex; gap: 10px; border-bottom: 1px solid #374151; overflow-x: auto; white-space: nowrap; align-items: center; }
        .logo { font-size: 20px; font-weight: 900; color: var(--primary); margin-left: 15px; }
        .nav-btn { background: #374151; color: var(--text-main); border: none; padding: 10px 20px; font-size: 14px; font-weight: bold; border-radius: 8px; cursor: pointer; transition: 0.3s; }
        .nav-btn.active { background: var(--primary); color: #fff; }
        
        @media (min-width: 768px) {
            body { flex-direction: row; }
            .sidebar { width: 250px; flex-direction: column; border-bottom: none; border-left: 1px solid #374151; overflow-x: visible; }
            .logo { font-size: 24px; text-align: center; margin-bottom: 20px; margin-left: 0; }
            .nav-btn { text-align: right; padding: 15px; }
        }

        .main-content { flex: 1; padding: 15px; overflow-y: auto; width: 100%; display: none; }
        @media (min-width: 768px) { .main-content { padding: 30px; } }
        
        .section-title { font-size: 20px; font-weight: bold; margin-bottom: 15px; color: #fff; border-bottom: 2px solid #374151; padding-bottom: 10px; }
        .admin-card { background: var(--card-bg); padding: 20px; border-radius: 12px; margin-bottom: 20px; border: 1px solid #374151; }
        .form-grid { display: grid; grid-template-columns: 1fr; gap: 15px; margin-bottom: 20px; }
        @media (min-width: 768px) { .form-grid { grid-template-columns: 1fr 1fr; } }
        
        .form-group { display: flex; flex-direction: column; gap: 5px; }
        .form-group.full-width { grid-column: 1 / -1; }
        label { font-weight: bold; color: var(--text-muted); font-size: 13px; }
        input, select { background: #374151; border: 1px solid #4b5563; color: white; padding: 12px; border-radius: 8px; outline: none; font-size: 14px; width: 100%; }
        input[type="file"] { padding: 8px; background: #1f2937; }
        input:focus, select:focus { border-color: var(--primary); }
        
        .radio-group { display: flex; gap: 15px; margin-top: 5px; }
        .radio-group label { display: flex; align-items: center; gap: 5px; color: white; cursor: pointer; font-size: 14px;}
        
        .btn-submit { background: var(--success); color: white; border: none; padding: 15px; border-radius: 8px; font-weight: bold; font-size: 16px; cursor: pointer; transition: 0.3s; width: 100%; }
        .progress-bar-container { width: 100%; background: #374151; border-radius: 5px; margin-top: 10px; display: none; overflow: hidden;}
        .progress-bar { width: 0%; height: 10px; background: var(--primary); transition: 0.2s; }
        #statusMessage { font-size: 12px; color: var(--primary); margin-top: 5px; display: block; }

        .table-responsive { width: 100%; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; min-width: 500px; }
        th, td { padding: 12px; text-align: right; border-bottom: 1px solid #374151; font-size: 14px; }
        th { background: #374151; color: var(--text-muted); }
        .btn-delete { background: var(--danger); color: white; border: none; padding: 5px 10px; border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 12px;}
        .game-img-preview { width: 40px; height: 40px; border-radius: 8px; object-fit: cover; }
    </style>
</head>
<body>

    <!-- شاشة الدخول (المفتاح السري) -->
    <div id="login-screen">
        <div class="login-box">
            <h2 style="color:var(--primary);">إدارة عصفور جيمز</h2>
            <p style="color:var(--text-muted); font-size:14px; margin-top:5px;">مسموح بالدخول للمدير فقط</p>
            <button class="btn-google" id="loginBtn">تسجيل الدخول (Google)</button>
        </div>
    </div>

    <!-- الشريط الجانبي -->
    <div class="sidebar" id="sidebar" style="display: none;">
        <div class="logo">المدير</div>
        <button class="nav-btn active" onclick="switchTab('games')">🎮 إدارة الألعاب</button>
        <button class="nav-btn" onclick="switchTab('users')">👥 اللاعبين</button>
        <button class="nav-btn" onclick="window.location.href='index.html'">العودة للموقع</button>
        <button class="nav-btn" style="color:var(--danger); border:1px solid var(--danger);" id="logoutBtn">تسجيل الخروج</button>
    </div>

    <!-- المحتوى الرئيسي -->
    <div class="main-content" id="main-content">
        <!-- الألعاب -->
        <div id="games-section">
            <div class="section-title">إضافة لعبة جديدة</div>
            <div class="admin-card">
                <form id="addGameForm">
                    <div class="form-grid">
                        <div class="form-group">
                            <label>اسم اللعبة</label>
                            <input type="text" id="gameTitle" required>
                        </div>
                        <div class="form-group">
                            <label>تصنيف اللعبة</label>
                            <select id="gameCategory" required>
                                <option value="adventure">مغامرات</option>
                                <option value="action">أكشن</option>
                                <option value="cars">سيارات</option>
                                <option value="puzzle">ذكاء وألغاز</option>
                                <option value="sports">رياضة</option>
                            </select>
                        </div>
                        <div class="form-group full-width">
                            <label>صورة اللعبة</label>
                            <input type="file" id="gameImgFile" accept="image/*" required>
                        </div>
                        <div class="form-group full-width">
                            <label>طريقة إضافة اللعبة</label>
                            <div class="radio-group">
                                <label><input type="radio" name="sourceType" value="link" checked onchange="toggleSourceInput()"> إضافة برابط خارجي</label>
                                <label><input type="radio" name="sourceType" value="upload" onchange="toggleSourceInput()"> رفع ملف اللعبة (HTML/ZIP)</label>
                            </div>
                        </div>
                        <div class="form-group full-width" id="linkInputGroup">
                            <label>رابط اللعبة</label>
                            <input type="url" id="gameUrlLink">
                        </div>
                        <div class="form-group full-width" id="fileInputGroup" style="display: none;">
                            <label>ملف اللعبة</label>
                            <input type="file" id="gameFile" accept=".html,.zip">
                        </div>
                    </div>
                    <div class="progress-bar-container" id="progressContainer"><div class="progress-bar" id="progressBar"></div></div>
                    <span id="statusMessage"></span>
                    <button type="submit" class="btn-submit" id="submitBtn">🚀 رفع وإضافة اللعبة</button>
                </form>
            </div>
            
            <div class="section-title">الألعاب الحالية</div>
            <div class="admin-card table-responsive">
                <table>
                    <thead><tr><th>صورة</th><th>اسم اللعبة</th><th>التصنيف</th><th>إجراء</th></tr></thead>
                    <tbody id="gamesTableBody"></tbody>
                </table>
            </div>
        </div>

        <!-- اللاعبين -->
        <div id="users-section" style="display: none;">
            <div class="section-title">بيانات اللاعبين</div>
            <div class="admin-card table-responsive">
                <table>
                    <thead><tr><th>الاسم</th><th>الإيميل</th><th>الألعاب</th><th>الدقائق</th><th>النقاط</th></tr></thead>
                    <tbody id="usersTableBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-firestore.js";
        import { getStorage, ref, uploadBytesResumable, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-storage.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBNlJ-hiRIPKD4apbRbt331MSi5t0o2XGU",
            authDomain: "asfour-games.firebaseapp.com",
            projectId: "asfour-games",
            storageBucket: "asfour-games.firebasestorage.app",
            messagingSenderId: "232632114081",
            appId: "1:232632114081:web:d81e9100a68252038b09e0"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();
        const db = getFirestore(app);
        const storage = getStorage(app);

        const ADMIN_EMAIL = "asfour.games67@gmail.com";

        document.getElementById('loginBtn').addEventListener('click', () => { signInWithPopup(auth, provider).catch(err => alert("حدث خطأ")); });
        document.getElementById('logoutBtn').addEventListener('click', () => { signOut(auth); });

        onAuthStateChanged(auth, (user) => {
            if (user && user.email === ADMIN_EMAIL) {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('sidebar').style.display = 'flex';
                document.getElementById('main-content').style.display = 'block';
                loadGames();
                loadUsers();
            } else if (user) {
                alert("عذراً، هذا الحساب غير مصرح له!");
                signOut(auth);
            } else {
                document.getElementById('login-screen').style.display = 'flex';
                document.getElementById('sidebar').style.display = 'none';
                document.getElementById('main-content').style.display = 'none';
            }
        });

        window.toggleSourceInput = function() {
            const sourceType = document.querySelector('input[name="sourceType"]:checked').value;
            if (sourceType === 'link') {
                document.getElementById('linkInputGroup').style.display = 'flex';
                document.getElementById('fileInputGroup').style.display = 'none';
                document.getElementById('gameUrlLink').required = true;
                document.getElementById('gameFile').required = false;
            } else {
                document.getElementById('linkInputGroup').style.display = 'none';
                document.getElementById('fileInputGroup').style.display = 'flex';
                document.getElementById('gameUrlLink').required = false;
                document.getElementById('gameFile').required = true;
            }
        }

        async function uploadFile(file, folderName) {
            return new Promise((resolve, reject) => {
                const storageRef = ref(storage, folderName + '/' + Date.now() + "_" + file.name);
                const uploadTask = uploadBytesResumable(storageRef, file);
                document.getElementById('progressContainer').style.display = 'block';

                uploadTask.on('state_changed', 
                    (snapshot) => {
                        const progress = (snapshot.bytesTransferred / snapshot.totalBytes) * 100;
                        document.getElementById('progressBar').style.width = progress + '%';
                        document.getElementById('statusMessage').innerText = `جاري الرفع: ${Math.round(progress)}%`;
                    }, 
                    (error) => reject(error), 
                    () => getDownloadURL(uploadTask.snapshot.ref).then(resolve)
                );
            });
        }

        document.getElementById('addGameForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.disabled = true; btn.innerText = "⏳ جاري الرفع...";
            
            try {
                const imgFile = document.getElementById('gameImgFile').files[0];
                const uploadedImgUrl = await uploadFile(imgFile, "images");
                
                let finalGameUrl = "";
                const sourceType = document.querySelector('input[name="sourceType"]:checked').value;
                if (sourceType === 'link') {
                    finalGameUrl = document.getElementById('gameUrlLink').value;
                } else {
                    const gameFile = document.getElementById('gameFile').files[0];
                    finalGameUrl = await uploadFile(gameFile, "games");
                }

                document.getElementById('statusMessage').innerText = "جاري الحفظ...";
                await addDoc(collection(db, "games"), {
                    title: document.getElementById('gameTitle').value,
                    category: document.getElementById('gameCategory').value,
                    img: uploadedImgUrl, url: finalGameUrl, timestamp: new Date()
                });

                alert("✅ تمت الإضافة بنجاح!");
                e.target.reset();
                document.getElementById('progressContainer').style.display = 'none';
                document.getElementById('statusMessage').innerText = "";
            } catch (error) { alert("❌ خطأ: " + error.message); } 
            finally { btn.disabled = false; btn.innerText = "🚀 رفع وإضافة اللعبة"; }
        });

        function loadGames() {
            onSnapshot(collection(db, "games"), (snapshot) => {
                const tbody = document.getElementById('gamesTableBody'); tbody.innerHTML = '';
                snapshot.forEach((docSnap) => {
                    const game = docSnap.data();
                    let catName = {"adventure":"مغامرات", "action":"أكشن", "cars":"سيارات", "puzzle":"ذكاء", "sports":"رياضة"};
                    tbody.innerHTML += `<tr>
                        <td><img src="${game.img}" class="game-img-preview"></td>
                        <td style="font-weight:bold;">${game.title}</td>
                        <td>${catName[game.category] || game.category}</td>
                        <td><button class="btn-delete" onclick="deleteGame('${docSnap.id}')">حذف</button></td>
                    </tr>`;
                });
            });
        }

        window.deleteGame = async function(id) { if(confirm("حذف اللعبة؟")) await deleteDoc(doc(db, "games", id)); }

        function loadUsers() {
            onSnapshot(collection(db, "users"), (snapshot) => {
                const tbody = document.getElementById('usersTableBody'); tbody.innerHTML = '';
                snapshot.forEach((docSnap) => {
                    const user = docSnap.data();
                    tbody.innerHTML += `<tr>
                        <td>${user.displayName || 'لاعب'}</td>
                        <td style="font-size:12px;">${user.email || 'مخفي'}</td>
                        <td style="color:var(--success); font-weight:bold;">${user.gamesPlayed || 0}</td>
                        <td>${user.playMinutes || 0}</td>
                        <td style="color:#f59e0b; font-weight:bold;">${user.points || 0}</td>
                    </tr>`;
                });
            });
        }

        window.switchTab = function(tab) {
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById('games-section').style.display = tab === 'games' ? 'block' : 'none';
            document.getElementById('users-section').style.display = tab === 'users' ? 'block' : 'none';
        }
    </script>
</body>
</html>
